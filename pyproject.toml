[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-activity-monitor"
version = "0.5.0"
description = "Loopback-only local Jev and Codex activity dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
local-activity-monitor = "local_activity_monitor.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_activity_monitor = ["web/*.html", "web/*.js", "web/*.css", "web/*.json", "web/*.svg"]
