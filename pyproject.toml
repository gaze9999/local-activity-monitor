[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-activity-monitor"
version = "0.9.0"
description = "Loopback-only local Codex and MCP activity dashboard"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
local-activity-monitor = "local_activity_monitor.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
local_activity_monitor = ["_web/*.html", "_web/*.js", "_web/*.css", "_web/*.json", "_web/*.svg", "_web/*.ico"]
"local_activity_monitor._workbench" = ["*.js", "*.mjs", "*.css", "manifest.json"]
