[package]
name = "lam-history-store"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
lam-session-core = { path = "../session-core" }
regex = "1"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.42.0", default-features = false, features = ["libsqlite3-sys", "bundled", "backup"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
sha2 = "0.10"
tempfile = "3"
url = "2.5"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
