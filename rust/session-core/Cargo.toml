[package]
name = "lam-session-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
sqlite-python = ["dep:rustpython-ast", "dep:rustpython-parser", "dep:shlex"]

[dependencies]
regex = "1"
rustpython-ast = { version = "0.4", default-features = false, features = ["visitor"], optional = true }
rustpython-parser = { version = "0.4", default-features = false, features = ["num-bigint"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
shlex = { version = "1", optional = true }
