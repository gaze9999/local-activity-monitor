name: Build CLI packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Attach packages to a draft Release, available from 1.0.0
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
          - os: ubuntu-22.04
            target: linux-x64
          - os: ubuntu-22.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read shared UI pin
        id: ui
        shell: pwsh
        run: |
          $uiPin = Get-Content workbench-ui.json -Raw | ConvertFrom-Json
          if ($uiPin.version -ne 1 -or $uiPin.repository -ne 'gaze9999/workbench-ui' -or $uiPin.revision -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid shared UI pin' }
          "revision=$($uiPin.revision)" >> $env:GITHUB_OUTPUT
      - name: Fetch pinned shared UI
        uses: actions/checkout@v4
        with:
          repository: gaze9999/workbench-ui
          ref: ${{ steps.ui.outputs.revision }}
          token: ${{ secrets.WORKBENCH_UI_READ_TOKEN }}
          path: .workbench-ui
          persist-credentials: false
      - name: Prepare offline UI assets
        uses: ./.workbench-ui/integrations/github-action
        with:
          project: .
          destination: src/local_activity_monitor/_workbench
      - name: Test source
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
      - name: Install isolated build tools
        run: python -m pip install -r tools/requirements-build.txt
      - name: Build and smoke test native bundle
        shell: pwsh
        env:
          WORKBENCH_UI_PATH: .workbench-ui
        run: |
          $buildArgs = @('tools/build_release.py', '--release')
          python @buildArgs
          if ($LASTEXITCODE -ne 0) { throw 'Native bundle verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read shared UI pin
        id: ui
        shell: pwsh
        run: |
          $uiPin = Get-Content workbench-ui.json -Raw | ConvertFrom-Json
          if ($uiPin.version -ne 1 -or $uiPin.repository -ne 'gaze9999/workbench-ui' -or $uiPin.revision -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid shared UI pin' }
          "revision=$($uiPin.revision)" >> $env:GITHUB_OUTPUT
      - name: Fetch pinned shared UI
        uses: actions/checkout@v4
        with:
          repository: gaze9999/workbench-ui
          ref: ${{ steps.ui.outputs.revision }}
          token: ${{ secrets.WORKBENCH_UI_READ_TOKEN }}
          path: .workbench-ui
          persist-credentials: false
      - name: Prepare offline UI assets
        uses: ./.workbench-ui/integrations/github-action
        with:
          project: .
          destination: src/local_activity_monitor/_workbench
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/local_activity_monitor/web/app.js
      - run: python -m pip install -r tools/requirements-build.txt
      - run: python -m build
      - name: Source archive with launchers
        env:
          PYTHONPATH: src
        run: |
          RELEASE_VERSION=$(python -c 'import local_activity_monitor as m; print(m.__version__)')
          python tools/archive_source.py "dist/local-activity-monitor-$RELEASE_VERSION-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*
          if-no-files-found: error

  assets:
    needs: [native, source]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: assets/SHA256SUMS.txt
          if-no-files-found: error
      - name: Check Release eligibility
        id: release
        env:
          PUBLISH_RELEASE: ${{ inputs.publish }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import os, re
          from local_activity_monitor import __version__
          requested = os.environ.get('PUBLISH_RELEASE') == 'true'
          if requested and not re.fullmatch(r'[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', __version__):
              raise SystemExit('GitHub Releases are disabled before 1.0.0')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('allowed=' + str(requested).lower() + '\n')
          PY
      - name: Attach to draft release
        if: steps.release.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          PYTHONPATH: src
        run: |
          RELEASE_TAG=v$(python3 -c 'import local_activity_monitor as m; print(m.__version__)')
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > draft-state; then
            test "$(cat draft-state)" = true || { echo 'Published releases are not overwritten'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --draft --title "$RELEASE_TAG" --notes '原生執行檔與原始碼套件. 各系統建置及啟動檢查結果請見 Actions.'
          fi
          gh release upload "$RELEASE_TAG" assets/* --clobber
