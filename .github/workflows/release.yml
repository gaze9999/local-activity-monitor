name: Build CLI packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed full-version Tag
        type: string
        required: true
      publish:
        description: Stage packages in a draft Release; never publishes it
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  eligibility:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version Tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import os, re, subprocess
          from local_activity_monitor import __version__
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag) or tag != 'v' + __version__:
              raise SystemExit('Tag must match the full application version')
          kind = subprocess.check_output(['git', 'cat-file', '-t', 'refs/tags/' + tag], text=True).strip()
          if kind != 'tag':
              raise SystemExit('An annotated Tag is required')
          PY

  native:
    needs: eligibility
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
          - os: ubuntu-22.04
            target: linux-x64
          - os: ubuntu-22.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read shared UI pin
        id: ui
        shell: pwsh
        run: |
          $uiPin = Get-Content workbench-ui.json -Raw | ConvertFrom-Json
          if ($uiPin.version -ne 1 -or $uiPin.repository -ne 'gaze9999/workbench-ui' -or $uiPin.revision -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid shared UI pin' }
          "revision=$($uiPin.revision)" >> $env:GITHUB_OUTPUT
      - name: Fetch pinned shared UI
        uses: actions/checkout@v4
        with:
          repository: gaze9999/workbench-ui
          ref: ${{ steps.ui.outputs.revision }}
          token: ${{ secrets.WORKBENCH_UI_READ_TOKEN }}
          path: .workbench-ui
          persist-credentials: false
      - name: Prepare offline UI assets
        uses: ./.workbench-ui/integrations/github-action
        with:
          project: .
          destination: src/local_activity_monitor/_workbench
      - name: Build application frontend
        run: python tools/build_frontend.py --verify-offline
      - name: Test source
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
      - name: Install isolated build tools
        run: python -m pip install -r tools/requirements-build.txt
      - name: Build and smoke test native bundle
        shell: pwsh
        env:
          WORKBENCH_UI_PATH: .workbench-ui
        run: |
          $buildArgs = @('tools/build_release.py', '--release')
          python @buildArgs
          if ($LASTEXITCODE -ne 0) { throw 'Native bundle verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  source:
    needs: eligibility
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read shared UI pin
        id: ui
        shell: pwsh
        run: |
          $uiPin = Get-Content workbench-ui.json -Raw | ConvertFrom-Json
          if ($uiPin.version -ne 1 -or $uiPin.repository -ne 'gaze9999/workbench-ui' -or $uiPin.revision -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid shared UI pin' }
          "revision=$($uiPin.revision)" >> $env:GITHUB_OUTPUT
      - name: Fetch pinned shared UI
        uses: actions/checkout@v4
        with:
          repository: gaze9999/workbench-ui
          ref: ${{ steps.ui.outputs.revision }}
          token: ${{ secrets.WORKBENCH_UI_READ_TOKEN }}
          path: .workbench-ui
          persist-credentials: false
      - name: Prepare offline UI assets
        uses: ./.workbench-ui/integrations/github-action
        with:
          project: .
          destination: src/local_activity_monitor/_workbench
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check frontend/app.js
      - run: python tools/build_frontend.py --verify-offline
      - run: python -m pip install -r tools/requirements-build.txt
      - run: python -m build
      - name: Source archive with launchers
        env:
          PYTHONPATH: src
        run: |
          RELEASE_VERSION=$(python -c 'import local_activity_monitor as m; print(m.__version__)')
          python tools/archive_source.py "dist/local-activity-monitor-$RELEASE_VERSION-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*
          if-no-files-found: error

  assets:
    needs: [native, source]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: assets/SHA256SUMS.txt
          if-no-files-found: error
      - name: Prepare verified draft Release
        if: inputs.publish
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          TAG_OBJECT=$(git rev-parse "refs/tags/$RELEASE_TAG")
          test "$(git cat-file -t "$TAG_OBJECT")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TAG_OBJECT"
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > draft-state; then
            test "$(cat draft-state)" = true || { echo 'Published releases are not overwritten'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes 'Verified build assets; publish only after the complete delivery is reviewed.'
          fi
      - name: Attach to draft Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" assets/*
